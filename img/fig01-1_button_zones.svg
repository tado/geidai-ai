<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F5D8A"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="800" height="390" fill="#FFFFFF"/>

  <!-- 上部の注記 -->
  <text x="125" y="80" font-size="14" font-weight="bold" fill="#2F5D8A" text-anchor="middle">制作者の仕事</text>
  <line x1="125" y1="86" x2="125" y2="104" stroke="#2F5D8A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="675" y="80" font-size="14" font-weight="bold" fill="#2F5D8A" text-anchor="middle">制作者の仕事</text>
  <line x1="675" y1="86" x2="675" y2="104" stroke="#2F5D8A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="400" y="62" font-size="13" fill="#666" text-anchor="middle">熱狂する人々も拒絶する人々も</text>
  <text x="400" y="80" font-size="13" fill="#666" text-anchor="middle">見ていたのはここだけ</text>
  <line x1="400" y1="86" x2="400" y2="104" stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ボタンの手前 -->
  <rect x="25" y="110" width="200" height="180" rx="8" fill="#F4F4F4" stroke="#555" stroke-width="1.5"/>
  <text x="125" y="142" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">ボタンの手前</text>
  <text x="125" y="162" font-size="13" fill="#666" text-anchor="middle">(人間)</text>
  <text x="125" y="196" font-size="14" fill="#333" text-anchor="middle">何を作りたいかを構想する</text>
  <text x="125" y="220" font-size="14" fill="#333" text-anchor="middle">それを言葉にする</text>
  <text x="125" y="244" font-size="14" fill="#333" text-anchor="middle">参照する素材を選ぶ</text>
  <text x="125" y="268" font-size="14" fill="#333" text-anchor="middle">設定を決める</text>

  <!-- ボタンの奥 -->
  <rect x="300" y="110" width="200" height="180" rx="8" fill="#F4F4F4" stroke="#555" stroke-width="1.5"/>
  <text x="400" y="142" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">ボタンの奥</text>
  <text x="400" y="162" font-size="13" fill="#666" text-anchor="middle">(AI)</text>
  <text x="400" y="208" font-size="14" fill="#333" text-anchor="middle">学習した傾向をもとに</text>
  <text x="400" y="232" font-size="14" fill="#333" text-anchor="middle">像や言葉を生成する</text>

  <!-- ボタンの向こう -->
  <rect x="575" y="110" width="200" height="180" rx="8" fill="#F4F4F4" stroke="#555" stroke-width="1.5"/>
  <text x="675" y="142" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">ボタンの向こう</text>
  <text x="675" y="162" font-size="13" fill="#666" text-anchor="middle">(人間)</text>
  <text x="675" y="196" font-size="14" fill="#333" text-anchor="middle">返ってきたものを吟味する</text>
  <text x="675" y="220" font-size="14" fill="#333" text-anchor="middle">選ぶ・捨てる</text>
  <text x="675" y="244" font-size="14" fill="#333" text-anchor="middle">手を加える</text>
  <text x="675" y="268" font-size="14" fill="#333" text-anchor="middle">作品として世界に差し出す</text>

  <!-- 手前 → (ボタン) → 奥 -->
  <line x1="227" y1="200" x2="297" y2="200" stroke="#2F5D8A" stroke-width="2.5" marker-end="url(#arr)"/>
  <circle cx="257" cy="200" r="11" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2.5"/>
  <circle cx="257" cy="200" r="6" fill="#2F5D8A"/>
  <text x="257" y="180" font-size="12" font-weight="bold" fill="#2F5D8A" text-anchor="middle">ボタン</text>

  <!-- 奥 → 向こう -->
  <line x1="502" y1="200" x2="572" y2="200" stroke="#2F5D8A" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 向こうから手前へ戻る -->
  <path d="M 675 291 V 318 Q 675 332 661 332 H 139 Q 125 332 125 318 V 294" stroke="#2F5D8A" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="400" y="360" font-size="13.5" fill="#444" text-anchor="middle">向こうで受け取ったものが、次の手前を変えていく</text>
</svg>
