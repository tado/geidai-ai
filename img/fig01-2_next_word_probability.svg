<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="800" height="460" fill="#FFFFFF"/>

  <text x="30" y="40" font-size="14" fill="#666">入力</text>
  <text x="68" y="40" font-size="17" font-weight="bold" fill="#222">「昔々、あるところに」</text>
  <text x="30" y="68" font-size="14" fill="#666">次に続く言葉の候補と、その確率</text>

  <!-- 確率の高い候補 -->
  
    <text text-anchor="end" fill="#222" font-size="15" x="200" y="112">おじいさんと</text>
    <text text-anchor="end" fill="#222" font-size="15" x="200" y="150">一人の</text>
    <text text-anchor="end" fill="#222" font-size="15" x="200" y="188">小さな</text>
    <text text-anchor="end" fill="#222" font-size="15" x="200" y="226">貧しい</text>
    <text text-anchor="end" fill="#222" font-size="15" x="200" y="264">美しい</text>
  
  <g fill="#2F5D8A">
    <rect x="215" y="97" width="418" height="20"/>
    <rect x="215" y="135" width="154" height="20"/>
    <rect x="215" y="173" width="99" height="20"/>
    <rect x="215" y="211" width="66" height="20"/>
    <rect x="215" y="249" width="44" height="20"/>
  </g>
  
    <text fill="#666" font-size="13" x="641" y="112">38%</text>
    <text fill="#666" font-size="13" x="377" y="150">14%</text>
    <text fill="#666" font-size="13" x="322" y="188">9%</text>
    <text fill="#666" font-size="13" x="289" y="226">6%</text>
    <text fill="#666" font-size="13" x="267" y="264">4%</text>
  

  <text x="192" y="304" font-size="18" fill="#888" text-anchor="middle">⋮</text>

  <!-- 裾野の候補 -->
  
    <text text-anchor="end" fill="#222" font-size="15" x="200" y="342">古い時計が</text>
    <text text-anchor="end" fill="#222" font-size="15" x="200" y="380">宇宙船が</text>
  
  <g fill="#2F5D8A">
    <rect x="215" y="327" width="2" height="20"/>
    <rect x="215" y="365" width="1.5" height="20"/>
  </g>
  
    <text fill="#666" font-size="13" x="225" y="342">0.05%</text>
    <text fill="#666" font-size="13" x="225" y="380">0.01%</text>
  

  <!-- 注記:確率の高い側 -->
  <line x1="540" y1="160" x2="540" y2="124" stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="450" y="178" font-size="14" fill="#222">学習データで頻繁に見かけた表現ほど</text>
  <text x="450" y="198" font-size="14" fill="#222">確率が高く、選ばれやすい</text>
  <text x="450" y="224" font-size="13" fill="#666">選び続ければ、最もありふれた表現に行き着く</text>

  <!-- 注記:裾野 -->
  <path d="M 292 324 H 300 V 386 H 292 M 300 355 H 308" stroke="#2F5D8A" stroke-width="1.5" fill="none"/>
  <text x="318" y="350" font-size="15" font-weight="bold" fill="#2F5D8A">確率の低い裾野</text>
  <text x="318" y="372" font-size="14" fill="#444">めずらしいもの、変わったものはここにある</text>

  <text x="30" y="436" font-size="12" fill="#888">※ 確率の値は説明のための模式的なもので、実際のモデルの出力ではありません。</text>
</svg>
